openapi: 3.1.0
info:
  title: API設計書
  version: 0.0.1
  description: バックエンドエンジニア用研修課題

tags:
  - name: Auth
    description: 認証に関する操作
  - name: Comment
    description: コメントに関する操作
  - name: User
    description: ユーザーに関する操作

security: []

servers:
  - url: http://localhost/api

paths:
  # --- 認証 ---
  '/register/pre':
    post:
      tags:
        - Auth
      summary: 仮登録（メールアドレス送信）
      description: 入力されたメールアドレス宛に6桁の認証コードを送信する
      operationId: preRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: 登録するメールアドレス
                  example: "test@example.com"
              required:
                - email
      responses:
        '200':
          description: メール送信成功
        '422':
          description: バリデーションエラー

  '/login':
    post:
      tags:
        - Auth
      summary: ログイン
      description: ユーザーのメールアドレスとパスワードでログインする
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: ユーザーのメールアドレス
                  example: "test@example.com"
                password:
                  type: string
                  description: パスワード
                  example: "password123"
              required:
                - email
                - password
      responses:
        '200':
          description: ログイン成功
        '401':
          description: 認証失敗（メールアドレスまたはパスワードが間違っている等）
        '422':
          description: バリデーションエラー

  '/logout':
    post:
      tags:
        - Auth
      summary: ログアウト
      description: 現在のAPIトークンを無効化してログアウトする
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ログアウト成功
        '401':
          description: 未認証（ログインしていない）

  # --- ユーザー登録・ユーザー一覧 ---
  '/users':
    post: 
      tags:
        - User
      summary: ユーザー登録 (本登録)
      description: メールに届いたトークンを用いて新しいユーザーを登録する
      operationId: storeUser
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "ユーザー登録に成功しました"
                  user:
                    $ref: '#/components/schemas/User'
        '422':
          description: バリデーションエラー
    get:
      tags:
        - User
      summary: ユーザー一覧
      description: 登録されたユーザーを一覧表示する
      operationId: indexUsers
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  # --- コメント登録・コメント一覧 ---
  '/articles/{article_id}/comments':
    parameters:
      - name: article_id
        in: path
        description: 記事のID
        required: true
        schema:
          type: integer
    post: 
      tags:
        - Comment
      summary: コメント登録
      description: 記事にコメントを投稿する。投稿者はログイン中のユーザーになる。
      operationId: storeComment
      security:
        - bearerAuth: []
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: 登録成功
        '401':
          description: 未認証
        '404':
          description: 指定された記事が見つかりません
        '422':
          description: バリデーションエラー
    get:
      tags:
        - Comment
      summary: コメント一覧
      description: 投稿されたコメントを一覧表示する
      operationId: indexComments
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '404':
          description: 指定された記事が見つかりません
  
  '/articles/{article_id}/comments/{comment_id}':
    parameters:
      - name: article_id
        in: path
        description: 記事のID
        required: true
        schema:
          type: integer

      - name: comment_id
        in: path
        description: コメントのID
        required: true
        schema:
          type: integer
    
    delete:
      tags:
        - Comment
      summary: コメント削除
      description: 投稿されたコメントの削除。自分自身のコメントのみ削除可能。
      operationId: deleteComments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 削除成功
        '401':
          description: 未認証
        '403':
          description: 他人のコメントは操作できません
        '404':
          description: 指定されたコメントが見つかりません
    put:
      tags:
        - Comment
      summary: コメント更新
      description: 投稿されたコメントの更新。自分自身のコメントのみ更新可能。
      operationId: updateComment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '200':
          description: 更新成功
        '401':
          description: 未認証
        '403':
          description: 他人のコメントは操作できません
        '404':
          description: コメントが見つかりません
        '422':
          description: バリデーションエラー

components: 
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ログイン時に取得した `access_token` を入力してください。

  schemas: 
    # 共通のデータ構造：入力用
    CommentInput:
      type: object
      properties: 
        content:
          type: string
          description: コメントの本文
          example: "この記事の内容は大変すばらしいです。"
      required: 
        - content
    
    # 共通のデータ構造：表示用
    Comment:
      type: object
      properties:
        comment_id:
          type: integer
          example: 1
          description: コメントの固有ID
        article_id:
          type: integer
          example: 5
          description: コメントが紐づく記事のID
        user_id:
          type: integer
          example: 1
          description: コメントを投稿したユーザーのID
        body:
          type: string
          description: コメント本文
          example: "この記事のリスク評価は非常に参考になります。"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: 
        - body

    # 共通のデータ構造：ユーザー入力用
    UserInput:
      type: object
      properties:
        name:
          type: string
          description: ユーザー名
          example: "Test User"
        email:
          type: string
          format: email
          description: 登録するメールアドレス
          example: "test@example.com"
        password:
          type: string
          description: パスワード（8文字以上）
          example: "password123"
        token:
          type: string
          description: 仮登録時にメール送信された6桁のトークン
          example: "123456"
      required:
        - name
        - email
        - password
        - token
        
    # 共通のデータ構造：ユーザー表示用
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Test User"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name